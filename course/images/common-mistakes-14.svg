  <text x="600" y="45" text-anchor="middle" fill="#f5f5f7" font-size="18" font-weight="600" letter-spacing="-0.4">Common Mistakes — Lesson 14</text>
  <text x="600" y="65" text-anchor="middle" fill="#6e6e73" font-size="11">Revise in the Right Order</text>

  
    <rect x="60" y="95" width="1080" height="50" rx="10" fill="rgba(255,60,60,0.04)" stroke="rgba(255,60,60,0.12)" stroke-width="1"/>
    <text x="90" y="117" fill="rgba(255,80,80,0.5)" font-size="14" font-weight="700">✗</text>
    <text x="120" y="115" fill="#d2d2d7" font-size="12">Starting with word choice before structure</text>
    <text x="120" y="135" fill="#2997ff" font-size="10">→ Fix structure → truth → clarity → voice → polish</text>
    
    <rect x="60" y="157" width="1080" height="50" rx="10" fill="rgba(255,60,60,0.04)" stroke="rgba(255,60,60,0.12)" stroke-width="1"/>
    <text x="90" y="179" fill="rgba(255,80,80,0.5)" font-size="14" font-weight="700">✗</text>
    <text x="120" y="177" fill="#d2d2d7" font-size="12">Polishing what you might cut</text>
    <text x="120" y="197" fill="#2997ff" font-size="10">→ Verify the paragraph belongs before refining it</text>
    
    <rect x="60" y="219" width="1080" height="50" rx="10" fill="rgba(255,60,60,0.04)" stroke="rgba(255,60,60,0.12)" stroke-width="1"/>
    <text x="90" y="241" fill="rgba(255,80,80,0.5)" font-size="14" font-weight="700">✗</text>
    <text x="120" y="239" fill="#d2d2d7" font-size="12">No decision log for changes</text>
    <text x="120" y="259" fill="#2997ff" font-size="10">→ Document what changed, why, and what evidence supports it</text>
    
    <rect x="60" y="281" width="1080" height="50" rx="10" fill="rgba(255,60,60,0.04)" stroke="rgba(255,60,60,0.12)" stroke-width="1"/>
    <text x="90" y="303" fill="rgba(255,80,80,0.5)" font-size="14" font-weight="700">✗</text>
    <text x="120" y="301" fill="#d2d2d7" font-size="12">Treating feedback as personal attack</text>
    <text x="120" y="321" fill="#2997ff" font-size="10">→ Separate the work from the writer; focus on viewer effect</text>
    
    <rect x="60" y="343" width="1080" height="50" rx="10" fill="rgba(255,60,60,0.04)" stroke="rgba(255,60,60,0.12)" stroke-width="1"/>
    <text x="90" y="365" fill="rgba(255,80,80,0.5)" font-size="14" font-weight="700">✗</text>
    <text x="120" y="363" fill="#d2d2d7" font-size="12">One revision pass and done</text>
    <text x="120" y="383" fill="#2997ff" font-size="10">→ Run multiple passes; save v1 and v2</text>
    

  <text x="600" y="435" text-anchor="middle" fill="#4e4e53" font-size="9">The Scriptwriter's Atlas · Lesson 14</text>
</svg>
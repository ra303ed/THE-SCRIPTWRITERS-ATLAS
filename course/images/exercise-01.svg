    <text x="115" y="173" text-anchor="middle" fill="#0066cc" font-size="13" font-weight="700">2</text>
    <text x="145" y="164" fill="#f5f5f7" font-size="13" font-weight="600">Write a question</text>
    <text x="145" y="182" fill="#86868b" font-size="11">What uncertainty does the viewer have?</text>
    <line x1="115" y1="190" x2="115" y2="202" stroke="rgba(0,102,204,0.2)" stroke-width="1" stroke-dasharray="3 3"/>
    
    <rect x="80" y="202" width="1040" height="44" rx="10" fill="rgba(0,102,204,0.04)" stroke="rgba(0,102,204,0.12)" stroke-width="1"/>
    <circle cx="115" cy="224" r="14" fill="rgba(0,102,204,0.15)" stroke="#0066cc" stroke-width="1.5"/>
    <text x="115" y="229" text-anchor="middle" fill="#0066cc" font-size="13" font-weight="700">3</text>
    <text x="145" y="220" fill="#f5f5f7" font-size="13" font-weight="600">Name the audience</text>
    <text x="145" y="238" fill="#86868b" font-size="11">Who needs this answered, and what do they already know?</text>
    <line x1="115" y1="246" x2="115" y2="258" stroke="rgba(0,102,204,0.2)" stroke-width="1" stroke-dasharray="3 3"/>
    
    <rect x="80" y="258" width="1040" height="44" rx="10" fill="rgba(0,102,204,0.04)" stroke="rgba(0,102,204,0.12)" stroke-width="1"/>

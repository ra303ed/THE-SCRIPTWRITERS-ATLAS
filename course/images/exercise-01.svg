  <text x="600" y="45" text-anchor="middle" fill="#f5f5f7" font-size="18" font-weight="600" letter-spacing="-0.4">Practice — Five Questions, One Idea</text>
  <text x="600" y="65" text-anchor="middle" fill="#6e6e73" font-size="11">Step-by-step exercise · The Scriptwriter's Atlas</text>

  
    <rect x="80" y="90" width="1040" height="44" rx="10" fill="rgba(0,102,204,0.04)" stroke="rgba(0,102,204,0.12)" stroke-width="1"/>

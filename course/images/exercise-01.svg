    <text x="115" y="117" text-anchor="middle" fill="#0066cc" font-size="13" font-weight="700">1</text>
    <text x="145" y="108" fill="#f5f5f7" font-size="13" font-weight="600">Pick a topic</text>
    <text x="145" y="126" fill="#86868b" font-size="11">The general subject you care about</text>
